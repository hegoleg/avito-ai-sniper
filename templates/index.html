<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Снайпер Авито | Сервис поиска выгодных сделок</title>
    <style>
        :root {
            --bg-body: #09090b;
            --bg-panel: #121215;
            --bg-card: #18181c;
            --bg-card-hover: #222228;
            --bg-input: #0e0e11;
            --border-color: #27272a;
            --border-active: #3b82f6;
            --text-main: #f4f4f5;
            --text-muted: #71717a;
            --text-sub: #a1a1aa;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
            line-height: 1.4;
        }

        /* Top Header */
        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            height: 48px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .status-pill {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #18181c;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
        }

        .status-dot.busy {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button, input, select {
            font-size: 12px;
            color: var(--text-main);
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            outline: none;
            transition: all 0.15s ease;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: #1c1c22;
        }

        button:hover {
            background: #272730;
            border-color: #3f3f46;
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn-success {
            background: #059669;
            border-color: #059669;
            color: #fff;
        }

        .btn-success:hover {
            background: #047857;
        }

        /* 1 Window Split Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 48px);
        }

        /* Left Panel: Catalog */
        .catalog-panel {
            width: 320px;
            flex-shrink: 0;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .catalog-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .catalog-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .catalog-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-sub);
        }

        .catalog-search-input {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            background: var(--bg-input);
        }

        .category-pills {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .category-pills::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: #18181c;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-chip:hover, .cat-chip.active {
            background: #272730;
            color: #fff;
            border-color: #3f3f46;
        }

        .catalog-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .catalog-item-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .catalog-item-row:hover {
            background: var(--bg-card-hover);
            border-color: #3f3f46;
        }

        .catalog-item-name {
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .catalog-item-specs {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .catalog-item-price {
            font-size: 11px;
            color: var(--success);
            font-weight: 600;
        }

        /* Right Panel: Sniper & Deals */
        .sniper-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-body);
        }

        /* Target Tabs Bar */
        .target-tabs {
            display: flex;
            overflow-x: auto;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 12px 0;
            gap: 4px;
            flex-shrink: 0;
        }

        .target-tab {
            padding: 6px 12px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 1px solid transparent;
            border-bottom: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .target-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }

        .target-tab.active {
            color: #fff;
            background: var(--bg-body);
            border-color: var(--border-color);
            border-bottom: 1px solid var(--bg-body);
            font-weight: 600;
        }

        /* Sniper Control Box */
        .sniper-controls {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-panel);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .query-input {
            width: 280px;
        }

        .price-input {
            width: 90px;
        }

        /* Scanner Progress Bar */
        .scanner-bar {
            display: none;
            background: #18181c;
            border-bottom: 1px solid var(--border-color);
            padding: 6px 16px;
            font-size: 11px;
            color: var(--text-sub);
            align-items: center;
            justify-content: space-between;
        }

        .scanner-bar.active {
            display: flex;
        }

        /* Deals Area */
        .deals-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 12px 16px;
        }

        .deals-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .deals-header-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .deals-count-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 4px;
            background: #1c1c22;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
        }

        .filters-note {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Deals Feed Table / List */
        .deals-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .deal-row {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.15s ease;
        }

        .deal-row:hover {
            border-color: #3f3f46;
            background: #16161b;
        }

        .deal-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }

        .deal-rank {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .deal-main {
            overflow: hidden;
            flex: 1;
        }

        .deal-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .deal-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        .deal-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--success);
        }

        .deal-tag {
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
        }

        .tag-verified {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .tag-fresh {
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .tag-savings {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .tag-delivery {
            background: #1c1c22;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
        }

        .deal-loc {
            color: var(--text-muted);
        }

        .deal-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-open {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-open:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-muted);
            background: var(--bg-panel);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="logo">
                <span>🎯</span> Снайпер Авито
            </div>
            <div class="status-pill">
                <span id="globalStatusDot" class="status-dot"></span>
                <span id="globalStatusText">Мониторинг активен</span>
            </div>
        </div>

        <div class="header-right">
            <button id="soundToggleBtn" onclick="toggleSound()">
                <span>🔔</span> Звук вкл
            </button>
            <div style="font-size: 11px; color: var(--text-muted);">
                Автопроверка: 7с
            </div>
        </div>
    </header>

    <!-- Workspace: 1 Window Split -->
    <div class="workspace">
        
        <!-- Left Column: Catalog -->
        <aside class="catalog-panel">
            <div class="catalog-header">
                <div class="catalog-title-row">
                    <span class="catalog-title">Каталог</span>
                    <span id="catalogCount" style="font-size: 11px; color: var(--text-muted);">...</span>
                </div>
                <input type="text" id="catalogSearchInput" class="catalog-search-input" placeholder="🔍 Поиск модели / чипа..." oninput="onCatalogSearchChange()">
                <div id="catalogCategoryPills" class="category-pills">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div id="catalogItemsList" class="catalog-items-list">
                <!-- Populated by JS -->
            </div>
        </aside>

        <!-- Right Column: Sniper & Deals -->
        <main class="sniper-panel">
            
            <!-- Target Tabs -->
            <div id="targetTabsBar" class="target-tabs">
                <!-- Populated by JS -->
            </div>

            <!-- Sniper Controls -->
            <div class="sniper-controls">
                <div class="input-group">
                    <label>Запрос:</label>
                    <input type="text" id="slotQueryInput" class="query-input" placeholder="например: rtx 3070">
                </div>

                <div class="input-group">
                    <label>Мин ₽:</label>
                    <input type="number" id="slotMinPriceInput" class="price-input" placeholder="0">
                </div>

                <div class="input-group">
                    <label>Макс ₽:</label>
                    <input type="number" id="slotMaxPriceInput" class="price-input" placeholder="∞">
                </div>

                <button onclick="startScanCurrentSlot()" class="btn-primary">
                    <span>🚀</span> Искать на Авито
                </button>

                <button onclick="reloadDealsCurrentSlot()" class="btn-secondary">
                    <span>⟳</span> Обновить
                </button>
            </div>

            <!-- Scan Progress Bar -->
            <div id="scannerBar" class="scanner-bar">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="scannerBarMsg">Сканирование Авито...</span>
                </div>
                <div id="scannerBarPct" style="font-weight: 700; color: #60a5fa;">0%</div>
            </div>

            <!-- Live Deals Feed -->
            <div class="deals-area">
                <div class="deals-header-row">
                    <div class="deals-header-title">
                        <span>Проверенные предложения</span>
                        <span id="dealsCountBadge" class="deals-count-badge">0 сделок</span>
                    </div>
                    <div class="filters-note">
                        🛡️ Без дефектов, без SODIMM, без брони и фейковых цен
                    </div>
                </div>

                <div id="dealsFeedList" class="deals-list">
                    <div class="empty-state">Загрузка предложений...</div>
                </div>
            </div>

        </main>
    </div>

    <!-- Web Audio Alert -->
    <script>
        let soundEnabled = true;
        function playChime() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            btn.innerHTML = soundEnabled ? '<span>🔔</span> Звук вкл' : '<span>🔕</span> Звук выкл';
            if (soundEnabled) playChime();
        }
    </script>

    <!-- App Logic -->
    <script>
        let slots = [];
        let activeSlotId = null;
        let activeCatalogCategory = 'all';
        let catalogCategories = [];
        let catalogDebounceTimer = null;
        let pollTimer = null;
        let isScannerRunning = false;

        async function init() {
            await loadCatalogCategories();
            await loadSlots();
            await loadCatalogItems();
            startPolling();
        }

        // --- Slots & Target Tabs ---
        async function loadSlots() {
            try {
                const res = await fetch('/api/build');
                const data = await res.json();
                slots = data.slots || [];

                if (!activeSlotId && slots.length > 0) {
                    activeSlotId = slots[0].slot_id;
                }

                renderTargetTabs();
                syncControlsWithActiveSlot();
                await loadDealsForActiveSlot();
            } catch (e) {
                console.error("Failed to load slots:", e);
            }
        }

        function renderTargetTabs() {
            const tabsContainer = document.getElementById('targetTabsBar');
            tabsContainer.innerHTML = "";

            slots.forEach(s => {
                const tab = document.createElement('div');
                const isActive = s.slot_id === activeSlotId;
                tab.className = `target-tab ${isActive ? 'active' : ''}`;
                tab.innerHTML = `<span>${s.icon || '🎯'}</span> ${s.slot_name}`;
                tab.onclick = () => selectSlot(s.slot_id);
                tabsContainer.appendChild(tab);
            });
        }

        async function selectSlot(slotId) {
            activeSlotId = slotId;
            renderTargetTabs();
            syncControlsWithActiveSlot();
            await loadDealsForActiveSlot();
        }

        function getActiveSlot() {
            return slots.find(s => s.slot_id === activeSlotId) || slots[0];
        }

        function syncControlsWithActiveSlot() {
            const slot = getActiveSlot();
            if (!slot) return;
            document.getElementById('slotQueryInput').value = slot.target_query || '';
            document.getElementById('slotMinPriceInput').value = slot.min_price || '';
            document.getElementById('slotMaxPriceInput').value = slot.max_price || '';
        }

        // --- Deals Feed ---
        async function loadDealsForActiveSlot() {
            const slot = getActiveSlot();
            if (!slot) return;

            const listEl = document.getElementById('dealsFeedList');
            const query = document.getElementById('slotQueryInput').value || slot.target_query;
            const minP = document.getElementById('slotMinPriceInput').value;
            const maxP = document.getElementById('slotMaxPriceInput').value;

            let url = `/api/deals/${encodeURIComponent(query)}`;
            const params = [];
            if (minP) params.push(`min_price=${minP}`);
            if (maxP) params.push(`max_price=${maxP}`);
            if (params.length > 0) url += `?${params.join('&')}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                const deals = data.deals || [];

                document.getElementById('dealsCountBadge').innerText = `${deals.length} сделок`;

                if (!deals.length) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            🤖 Предложений в базе пока нет. Нажмите <b>«Искать на Авито»</b> для запуска перехвата сделок.
                        </div>
                    `;
                    return;
                }

                listEl.innerHTML = "";
                deals.forEach((d, idx) => {
                    const row = document.createElement('div');
                    row.className = "deal-row";

                    const badgeVerified = d.is_verified 
                        ? `<span class="deal-tag tag-verified">✓ Проверено</span>`
                        : '';
                    const badgeFresh = d.freshness
                        ? `<span class="deal-tag tag-fresh">🕒 ${d.freshness}</span>`
                        : '';
                    const badgeSavings = (d.savings_pct && d.savings_pct > 0)
                        ? `<span class="deal-tag tag-savings">🔥 -${d.savings_pct}%</span>`
                        : '';
                    const badgeDelivery = d.has_delivery
                        ? `<span class="deal-tag tag-delivery">🚚 Доставка</span>`
                        : '';
                    const sellerInfo = d.seller_rating
                        ? `<span style="color: var(--text-sub);">⭐ ${d.seller_rating}</span>`
                        : '';

                    row.innerHTML = `
                        <div class="deal-left">
                            <span class="deal-rank">${idx + 1}</span>
                            <div class="deal-main">
                                <div class="deal-title" title="${d.title}">${d.title}</div>
                                <div class="deal-meta">
                                    <span class="deal-price">${d.price.toLocaleString('ru-RU')} ₽</span>
                                    ${badgeSavings}
                                    ${badgeVerified}
                                    ${badgeFresh}
                                    ${badgeDelivery}
                                    ${sellerInfo}
                                    <span class="deal-loc">• ${d.location || 'РФ'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="deal-actions">
                            <a href="${d.url}" target="_blank" class="btn-open" title="Перейти на объявление">
                                На Авито ↗
                            </a>
                        </div>
                    `;
                    listEl.appendChild(row);
                });
            } catch (e) {
                listEl.innerHTML = `<div class="empty-state" style="color: var(--danger);">Ошибка загрузки: ${e}</div>`;
            }
        }

        async function saveCurrentSlotConfig() {
            const slot = getActiveSlot();
            if (!slot) return;
            const query = document.getElementById('slotQueryInput').value.trim();
            const minP = document.getElementById('slotMinPriceInput').value;
            const maxP = document.getElementById('slotMaxPriceInput').value;

            slot.target_query = query;
            slot.min_price = minP ? parseInt(minP) : null;
            slot.max_price = maxP ? parseInt(maxP) : null;

            await fetch('/api/build/update_slot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    slot_id: slot.slot_id,
                    query: query,
                    min_price: slot.min_price,
                    max_price: slot.max_price
                })
            });
        }

        async function startScanCurrentSlot() {
            const slot = getActiveSlot();
            if (!slot) return;

            await saveCurrentSlotConfig();

            try {
                const res = await fetch(`/api/scan/${slot.slot_id}`, { method: 'POST' });
                if (res.status === 409) {
                    alert("Сканер уже занят другой задачей, дождитесь завершения.");
                    return;
                }
                const banner = document.getElementById('scannerBar');
                banner.classList.add('active');
                document.getElementById('scannerBarMsg').innerText = `Запущен поиск для '${slot.target_query}'...`;
                document.getElementById('scannerBarPct').innerText = `5%`;
            } catch (e) {
                alert("Ошибка запуска сканера: " + e);
            }
        }

        async function reloadDealsCurrentSlot() {
            await saveCurrentSlotConfig();
            await loadDealsForActiveSlot();
        }

        // --- Catalog ---
        async function loadCatalogCategories() {
            try {
                const res = await fetch('/api/catalog/categories');
                catalogCategories = await res.json();
                renderCatalogCategories();
            } catch (e) {
                console.error("Failed to load catalog categories:", e);
            }
        }

        function renderCatalogCategories() {
            const container = document.getElementById('catalogCategoryPills');
            container.innerHTML = `
                <div class="cat-chip ${activeCatalogCategory === 'all' ? 'active' : ''}" onclick="setCatalogCategory('all')">
                    Все
                </div>
            `;
            catalogCategories.forEach(c => {
                const chip = document.createElement('div');
                chip.className = `cat-chip ${activeCatalogCategory === c.id ? 'active' : ''}`;
                chip.innerText = c.name;
                chip.onclick = () => setCatalogCategory(c.id);
                container.appendChild(chip);
            });
        }

        async function setCatalogCategory(catId) {
            activeCatalogCategory = catId;
            renderCatalogCategories();
            await loadCatalogItems();
        }

        function onCatalogSearchChange() {
            clearTimeout(catalogDebounceTimer);
            catalogDebounceTimer = setTimeout(loadCatalogItems, 250);
        }

        async function loadCatalogItems() {
            const listEl = document.getElementById('catalogItemsList');
            const query = document.getElementById('catalogSearchInput').value.trim();

            let url = `/api/catalog?query=${encodeURIComponent(query)}`;
            if (activeCatalogCategory && activeCatalogCategory !== 'all') {
                url += `&category=${encodeURIComponent(activeCatalogCategory)}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                const items = data.items || [];
                document.getElementById('catalogCount').innerText = `${items.length} поз.`;

                if (!items.length) {
                    listEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Ничего не найдено</div>`;
                    return;
                }

                listEl.innerHTML = "";
                items.forEach(it => {
                    const row = document.createElement('div');
                    row.className = "catalog-item-row";
                    row.title = "Нажмите для выбора чипа";
                    row.onclick = () => applyCatalogItemToActiveSlot(it);

                    row.innerHTML = `
                        <div class="catalog-item-name">
                            <span>${it.name}</span>
                        </div>
                        <div class="catalog-item-specs">${it.specs || it.chip}</div>
                        <div class="catalog-item-price">
                            ${(it.min_price || 0).toLocaleString('ru-RU')} — ${(it.max_price || 0).toLocaleString('ru-RU')} ₽
                        </div>
                    `;
                    listEl.appendChild(row);
                });
            } catch (e) {
                listEl.innerHTML = `<div style="color: var(--danger); padding: 10px;">Ошибка: ${e}</div>`;
            }
        }

        async function applyCatalogItemToActiveSlot(catalogItem) {
            // Find corresponding slot by catalog category if applicable, or use active slot
            let targetSlotId = activeSlotId;
            const matchingSlot = slots.find(s => s.slot_id === catalogItem.category);
            if (matchingSlot) {
                targetSlotId = matchingSlot.slot_id;
            }

            try {
                await fetch('/api/build/apply_catalog', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        slot_id: targetSlotId,
                        catalog_id: catalogItem.id
                    })
                });

                playChime();
                await loadSlots();
                await selectSlot(targetSlotId);
            } catch (e) {
                alert("Ошибка применения: " + e);
            }
        }

        // --- Status Polling & Silent Background Auto-refresh ---
        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch('/api/scan/status');
                    const status = await res.json();

                    const dot = document.getElementById('globalStatusDot');
                    const text = document.getElementById('globalStatusText');
                    const bar = document.getElementById('scannerBar');

                    if (status.is_running) {
                        isScannerRunning = true;
                        dot.className = "status-dot busy";
                        text.innerText = `Поиск: ${status.query || ''}`;
                        bar.classList.add('active');
                        document.getElementById('scannerBarMsg').innerText = status.message || 'Сканирование Авито...';
                        document.getElementById('scannerBarPct').innerText = `${status.progress || 0}%`;
                    } else {
                        dot.className = "status-dot";
                        text.innerText = "Мониторинг активен";
                        if (bar.classList.contains('active')) {
                            bar.classList.remove('active');
                            if (status.new_deals_count > 0) {
                                playChime();
                            }
                            await loadDealsForActiveSlot();
                        }
                    }
                } catch (e) {}
            }, 1500);

            // Silent refresh of active slot deals feed every 7 seconds
            setInterval(async () => {
                if (!isScannerRunning) {
                    await loadDealsForActiveSlot();
                }
            }, 7000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

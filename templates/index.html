<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Снайпер Авито</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --card: #ffffff;
            --line: #e3e6ec;
            --text: #171a21;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-h: #1d4ed8;
            --ok: #059669;
            --warn: #b45309;
            --danger: #dc2626;
            --chip: #f1f3f6;
            --chip-active: #e0e7ff;
            --shadow: 0 1px 2px rgba(16, 24, 40, .04);
        }

        [data-theme="dark"] {
            --bg: #0f1115;
            --card: #15181e;
            --line: #262b35;
            --text: #e8eaf0;
            --muted: #8b93a5;
            --accent: #3b82f6;
            --accent-h: #60a5fa;
            --ok: #34d399;
            --warn: #fbbf24;
            --danger: #f87171;
            --chip: #1c2028;
            --chip-active: #1e2a44;
            --shadow: none;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.2px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok);
        }

        .dot.busy {
            background: var(--warn);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .35; }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .search {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid var(--line);
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            font: inherit;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 11px;
            outline: none;
            min-width: 0;
            transition: border-color .15s;
        }

        input:focus {
            border-color: var(--accent);
        }

        #query {
            flex: 1;
            min-width: 220px;
        }

        .price {
            width: 112px;
        }

        button {
            font: inherit;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, border-color .15s;
        }

        button:hover {
            background: var(--chip);
        }

        button:disabled {
            opacity: .55;
            cursor: default;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: var(--accent-h);
            border-color: var(--accent-h);
        }

        .filters input {
            flex: 1;
            min-width: 200px;
        }

        .filters .rating {
            flex: 0 0 205px;
            min-width: 165px;
        }

        .sound {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .hidden { display: none !important; }

        .progress {
            padding: 0 16px 14px;
        }

        .bar {
            height: 4px;
            border-radius: 99px;
            background: var(--chip);
            overflow: hidden;
        }

        .bar > span {
            display: block;
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width .3s ease;
        }

        .progress-text {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .results {
            padding: 14px 16px 16px;
        }

        .results-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .results-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 13px;
        }

        .badge {
            padding: 1px 7px;
            border-radius: 99px;
            background: var(--chip);
            border: 1px solid var(--line);
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
        }

        .deal {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .deal:hover {
            background: var(--chip);
        }

        .rank {
            width: 20px;
            flex-shrink: 0;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .deal-body {
            flex: 1;
            min-width: 0;
        }

        .deal-title {
            display: block;
            font-weight: 600;
            color: inherit;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        a.deal-title:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .deal-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .tag {
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid var(--line);
            background: var(--chip);
            color: var(--muted);
            font-size: 11px;
        }

        .tag.ok { color: var(--ok); }
        .tag.save { color: var(--warn); }

        .loc::before {
            content: "•";
            margin-right: 6px;
            color: var(--line);
        }

        .open {
            flex-shrink: 0;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--accent);
            font-size: 12px;
            text-decoration: none;
        }

        .open:hover {
            border-color: var(--accent);
        }

        .empty {
            padding: 28px 12px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        .empty.error { color: var(--danger); }

        .icon-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* Catalog modal */
        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 6vh 16px;
            background: rgba(10, 12, 16, .55);
            z-index: 20;
        }

        .modal.open { display: flex; }

        .sheet {
            width: 100%;
            max-width: 760px;
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
        }

        .sheet-top {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }

        .sheet-top input { flex: 1; }

        .chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar { display: none; }

        .chip {
            padding: 4px 9px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--muted);
            font-size: 12px;
        }

        .chip.active {
            background: var(--chip-active);
            color: var(--text);
            border-color: var(--accent);
        }

        .cat-items {
            padding: 10px 12px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cat-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: transparent;
        }

        .cat-item:hover {
            background: var(--chip);
            border-color: var(--accent);
        }

        .cat-name { font-weight: 600; }
        .cat-specs { font-size: 12px; color: var(--muted); }
        .cat-price { font-size: 12px; color: var(--ok); }

        @media (max-width: 640px) {
            .wrap { padding: 14px 10px 32px; }
            h1 { font-size: 16px; }
            .open { display: none; }
            .price { width: 96px; }
        }
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <h1>Снайпер Авито</h1>
        <div class="row">
            <div class="status">
                <span id="statusDot" class="dot"></span>
                <span id="statusText">Готов</span>
            </div>
            <button id="themeBtn" class="icon-btn" type="button" title="Сменить тему">☾</button>
        </div>
    </header>

    <main class="card">
        <div class="search">
            <div class="row">
                <input id="query" type="text" placeholder="Любой товар: rtx 3070, ryzen 5 5600x, ps5, iphone 13…" autocomplete="off">
                <button id="catalogBtn" type="button">Каталог</button>
            </div>

            <div class="row">
                <input id="minPrice" class="price" type="number" placeholder="Мин ₽" min="0">
                <input id="maxPrice" class="price" type="number" placeholder="Макс ₽" min="0">
                <button id="searchBtn" class="btn-primary" type="button">Найти</button>
                <button id="refreshBtn" type="button">Обновить</button>
                <button id="filtersBtn" type="button">Фильтры</button>
                <label class="sound">
                    <input id="sound" type="checkbox" checked> звук
                </label>
            </div>

            <div id="filters" class="row filters hidden">
                <input id="requiredWords" type="text" placeholder="Обязательные слова через запятую" autocomplete="off">
                <input id="excludeWords" type="text" placeholder="Минус-слова через запятую" autocomplete="off">
                <input id="minSellerRating" class="rating" type="number" placeholder="Рейтинг продавца от 0 до 5" min="0" max="5" step="0.1" inputmode="decimal">
                <label class="sound">
                    <input id="excludeMobile" type="checkbox" checked> без мобильных видеокарт
                </label>
            </div>
        </div>

        <div id="progress" class="progress hidden">
            <div class="bar"><span id="barFill"></span></div>
            <div id="progressText" class="progress-text"></div>
        </div>

        <div class="results">
            <div class="results-head">
                <div class="results-title">
                    Предложения <span id="count" class="badge">0</span>
                </div>
                <span>«проверено» — лот вскрыт, дефектов и брони нет</span>
            </div>
            <div id="list">
                <div class="empty">Введите запрос и нажмите «Найти» — или выберите готовый чип в каталоге.</div>
            </div>
        </div>
    </main>
</div>

<div id="modal" class="modal">
    <div class="sheet">
        <div class="sheet-top">
            <input id="catSearch" type="text" placeholder="Поиск по каталогу: 3070, 5600x, ddr4, b550m…" autocomplete="off">
            <button id="catClose" type="button">Закрыть</button>
        </div>
        <div id="cats" class="chips"></div>
        <div id="catList" class="cat-items"></div>
    </div>
</div>

<script>
    const el = (id) => document.getElementById(id);
    const PREFS_KEY = 'avito-sniper:universal';
    const THEME_KEY = 'avito-sniper:theme';

    let running = false;
    let wasRunning = false;
    let activeQuery = '';
    let catLoaded = false;
    let catCategory = 'all';
    let catTimer = null;

    function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    function toNum(value) {
        const n = parseInt(value, 10);
        return Number.isFinite(n) ? n : null;
    }

    function toFloat(value) {
        if (value == null || String(value).trim() === '') return null;
        const n = parseFloat(String(value).replace(',', '.'));
        return Number.isFinite(n) ? n : null;
    }

    function money(value) {
        return Number(value || 0).toLocaleString('ru-RU');
    }

    function isMobileTitle(title) {
        const t = String(title || '').toLowerCase();
        return /\b(mobile|мобайл|ноутбучн\w*|для\s+ноутбук\w*)\b/.test(t) || /\d{4}\s*m\b/.test(t);
    }

    function setStatus(text, busy) {
        el('statusText').textContent = text;
        el('statusDot').className = busy ? 'dot busy' : 'dot';
    }

    function setProgress(visible, message, percent) {
        el('progress').classList.toggle('hidden', !visible);
        if (message != null) el('progressText').textContent = message;
        if (percent != null) el('barFill').style.width = Math.max(0, Math.min(100, percent)) + '%';
    }

    function chime() {
        if (!el('sound').checked) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + .15);
            gain.gain.setValueAtTime(.18, now);
            gain.gain.exponentialRampToValueAtTime(.001, now + .4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + .4);
        } catch (e) { /* audio is optional */ }
    }

    // ---------- Theme & prefs ----------

    function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        el('themeBtn').textContent = theme === 'dark' ? '☀' : '☾';
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }

    function loadPrefs() {
        try {
            const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
            el('query').value = p.query || '';
            el('minPrice').value = p.min || '';
            el('maxPrice').value = p.max || '';
            el('requiredWords').value = p.required || '';
            el('excludeWords').value = p.exclude || '';
            el('minSellerRating').value = p.minRating || '';
            el('excludeMobile').checked = p.excludeMobile !== false;
            activeQuery = p.query || '';
        } catch (e) {}
    }

    function savePrefs() {
        try {
            localStorage.setItem(PREFS_KEY, JSON.stringify({
                query: el('query').value.trim(),
                min: el('minPrice').value,
                max: el('maxPrice').value,
                required: el('requiredWords').value.trim(),
                exclude: el('excludeWords').value.trim(),
                minRating: el('minSellerRating').value,
                excludeMobile: el('excludeMobile').checked
            }));
        } catch (e) {}
    }

    // ---------- Search ----------

    async function startSearch() {
        const query = el('query').value.trim();
        if (!query) {
            el('query').focus();
            return;
        }

        savePrefs();
        activeQuery = query;
        el('searchBtn').disabled = true;
        setStatus('Запуск поиска', true);
        setProgress(true, 'Открываем браузер и запускаем поиск…', 5);

        try {
            const res = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: query,
                    min_price: toNum(el('minPrice').value),
                    max_price: toNum(el('maxPrice').value),
                    required_words: el('requiredWords').value.trim(),
                    exclude_words: el('excludeWords').value.trim(),
                    min_seller_rating: toFloat(el('minSellerRating').value),
                    exclude_mobile: el('excludeMobile').checked
                })
            });

            if (res.status === 409) {
                setProgress(false);
                setStatus('Сканер занят', true);
                return;
            }
            if (!res.ok) {
                throw new Error(await res.text());
            }

            running = true;
            wasRunning = true;
            await pollStatus();
        } catch (e) {
            setProgress(false);
            setStatus('Ошибка запуска', false);
            alert('Не удалось запустить поиск: ' + e.message);
        } finally {
            el('searchBtn').disabled = false;
        }
    }

    async function pollStatus() {
        try {
            const res = await fetch('/api/scan/status', { cache: 'no-store' });
            const status = await res.json();
            running = !!status.is_running;

            if (running) {
                wasRunning = true;
                setStatus('Идёт поиск', true);
                setProgress(true, status.message || 'Сканирование Авито…', status.progress || 0);
                return;
            }

            setProgress(false);
            setStatus('Готов', false);

            if (wasRunning) {
                wasRunning = false;
                if ((status.new_deals_count || 0) > 0) chime();
                await loadDeals();
            }
        } catch (e) { /* keep UI usable if the server is restarting */ }
    }

    // ---------- Deals ----------

    async function loadDeals() {
        const query = el('query').value.trim() || activeQuery;
        if (!query) return;
        activeQuery = query;

        const params = new URLSearchParams();
        const min = toNum(el('minPrice').value);
        const max = toNum(el('maxPrice').value);
        if (min !== null) params.set('min_price', min);
        if (max !== null) params.set('max_price', max);
        const minRating = toFloat(el('minSellerRating').value);
        if (minRating !== null) params.set('min_seller_rating', minRating);
        params.set('exclude_mobile', el('excludeMobile').checked ? '1' : '0');

        const url = '/api/deals/' + encodeURIComponent(query) + (params.toString() ? '?' + params.toString() : '');
        el('list').innerHTML = '<div class="empty">Загружаем предложения…</div>';

        try {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            renderDeals(data.deals || []);
        } catch (e) {
            el('list').innerHTML = '<div class="empty error">Не удалось загрузить предложения: ' + esc(e.message) + '</div>';
        }
    }

    function renderDeals(deals) {
        el('count').textContent = deals.length;

        if (!deals.length) {
            el('list').innerHTML = '<div class="empty">Пока пусто. Запустите поиск — снайпер проверит лоты и оставит только чистые предложения.</div>';
            return;
        }

        const frag = document.createDocumentFragment();

        deals.forEach((deal, index) => {
            const url = /^https?:\/\//i.test(deal.url || '') ? deal.url : '';
            const tags = [];

            if (deal.is_verified) tags.push('<span class="tag ok">проверено</span>');
            else tags.push('<span class="tag">не проверено</span>');
            if (isMobileTitle(deal.title)) tags.push('<span class="tag">мобильная</span>');
            if (deal.freshness) tags.push('<span class="tag">' + esc(deal.freshness) + '</span>');
            if (deal.savings_pct > 0) tags.push('<span class="tag save">−' + esc(deal.savings_pct) + '%</span>');
            if (deal.has_delivery) tags.push('<span class="tag">доставка</span>');
            if (deal.seller_rating) {
                tags.push('<span class="tag">★ ' + esc(deal.seller_rating) + (deal.seller_reviews ? ' · ' + esc(deal.seller_reviews) : '') + '</span>');
            }

            const row = document.createElement('div');
            row.className = 'deal';
            row.innerHTML =
                '<div class="rank">' + (index + 1) + '</div>' +
                '<div class="deal-body">' +
                    (url
                        ? '<a class="deal-title" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(deal.title) + '</a>'
                        : '<div class="deal-title">' + esc(deal.title) + '</div>') +
                    '<div class="meta">' +
                        '<span class="deal-price">' + money(deal.price) + ' ₽</span>' +
                        tags.join('') +
                        '<span class="loc">' + esc(deal.location || 'РФ') + '</span>' +
                    '</div>' +
                '</div>' +
                (url ? '<a class="open" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Открыть</a>' : '');

            frag.appendChild(row);
        });

        el('list').replaceChildren(frag);
    }

    // ---------- Catalog ----------

    function openCatalog() {
        el('modal').classList.add('open');
        if (!catLoaded) {
            fetch('/api/catalog/categories')
                .then((r) => r.json())
                .then((categories) => {
                    window.__catalogCategories = categories || [];
                    renderCats();
                    catLoaded = true;
                })
                .catch(() => renderCats());
        }
        loadCatItems();
        setTimeout(() => el('catSearch').focus(), 30);
    }

    function closeCatalog() {
        el('modal').classList.remove('open');
    }

    function renderCats() {
        const box = el('cats');
        const categories = window.__catalogCategories || [];
        box.replaceChildren();

        const all = document.createElement('button');
        all.type = 'button';
        all.className = 'chip' + (catCategory === 'all' ? ' active' : '');
        all.textContent = 'Все';
        all.onclick = () => { catCategory = 'all'; renderCats(); loadCatItems(); };
        box.appendChild(all);

        categories.forEach((category) => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip' + (catCategory === category.id ? ' active' : '');
            chip.textContent = category.name;
            chip.onclick = () => { catCategory = category.id; renderCats(); loadCatItems(); };
            box.appendChild(chip);
        });
    }

    async function loadCatItems() {
        const query = el('catSearch').value.trim();
        let url = '/api/catalog?query=' + encodeURIComponent(query);
        if (catCategory !== 'all') url += '&category=' + encodeURIComponent(catCategory);

        el('catList').innerHTML = '<div class="empty">Загрузка каталога…</div>';

        try {
            const res = await fetch(url);
            const data = await res.json();
            const items = data.items || [];

            if (!items.length) {
                el('catList').innerHTML = '<div class="empty">Ничего не найдено</div>';
                return;
            }

            const frag = document.createDocumentFragment();
            items.forEach((item) => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'cat-item';
                row.innerHTML =
                    '<span class="cat-name">' + esc(item.name) + '</span>' +
                    '<span class="cat-specs">' + esc(item.specs || item.chip || '') + '</span>' +
                    '<span class="cat-price">' + money(item.min_price) + ' — ' + money(item.max_price) + ' ₽</span>';
                row.onclick = () => applyCatalogItem(item);
                frag.appendChild(row);
            });
            el('catList').replaceChildren(frag);
        } catch (e) {
            el('catList').innerHTML = '<div class="empty error">Ошибка каталога: ' + esc(e.message) + '</div>';
        }
    }

    function applyCatalogItem(item) {
        el('query').value = item.query || item.name || '';
        el('minPrice').value = item.min_price || '';
        el('maxPrice').value = item.max_price || '';
        savePrefs();
        closeCatalog();
        el('query').focus();
    }

    // ---------- Wiring ----------

    function init() {
        let theme = 'light';
        try { theme = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) {}
        applyTheme(theme);
        loadPrefs();

        el('searchBtn').addEventListener('click', startSearch);
        el('refreshBtn').addEventListener('click', () => { savePrefs(); loadDeals(); });
        el('filtersBtn').addEventListener('click', () => el('filters').classList.toggle('hidden'));
        el('catalogBtn').addEventListener('click', openCatalog);
        el('catClose').addEventListener('click', closeCatalog);
        el('themeBtn').addEventListener('click', () => {
            applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        });

        el('query').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') startSearch();
        });

        el('catSearch').addEventListener('input', () => {
            clearTimeout(catTimer);
            catTimer = setTimeout(loadCatItems, 220);
        });

        el('modal').addEventListener('click', (event) => {
            if (event.target === el('modal')) closeCatalog();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeCatalog();
        });

        setStatus('Готов', false);
        pollStatus();

        if (el('query').value.trim()) {
            loadDeals();
        }

        setInterval(pollStatus, 1500);
        setInterval(() => {
            if (!running && el('query').value.trim()) loadDeals();
        }, 20000);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
